name: ScholarShield CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Compile Midnight Compact Smart Contracts
        run: npm run compile:compact

      - name: Run Vitest Compact Contract & ZK Engine Tests
        run: npm test

      - name: Verify Submission Package Health Check
        run: npm run audit

      - name: Build Next.js Production Application
        run: npm run build
